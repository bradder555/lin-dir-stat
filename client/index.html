<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinDirStat</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      // Applied synchronously, before first paint, so the resolved theme
      // (saved preference, falling back to the OS setting) doesn't flash
      // the wrong mode on load.
      (function () {
        try {
          const saved = localStorage.getItem('theme');
          const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <header id="topbar">
      <h1>LinDirStat</h1>
      <div id="topbar-actions">
        <label class="theme-toggle" title="Toggle dark mode">
          <input type="checkbox" id="theme-toggle-checkbox" />
          <span class="theme-toggle-track"><span class="theme-toggle-thumb"></span></span>
        </label>
        <button id="refresh-btn" class="cleanup-btn">Refresh</button>
      </div>
    </header>
    <div id="layout">
      <aside id="side-panel">
        <div id="tree-panel" class="panel-half">
          <div class="panel-heading">Files</div>
          <div id="tree-content"></div>
          <div id="tree-spinner" class="panel-spinner hidden"><div class="spinner"></div></div>
        </div>
        <div id="cleanup-panel" class="panel-half">
          <div class="panel-heading">Cleanup</div>
          <div id="cleanup-content"></div>
          <div id="cleanup-spinner" class="panel-spinner hidden"><div class="spinner"></div></div>
        </div>
      </aside>
      <main id="view">
        <div class="panel-heading-row">
          <span class="panel-heading">Storage Map</span>
          <label class="free-space-toggle">
            <input type="checkbox" id="free-space-checkbox" checked />
            Show free space
          </label>
        </div>
        <svg id="chart"></svg>
        <div id="spinner" class="hidden"><div class="spinner"></div></div>
        <div id="error" class="hidden"></div>
      </main>
    </div>

    <div id="context-menu" class="hidden"></div>

    <div id="confirm-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <div class="modal-title">Delete this item?</div>
        <div class="modal-body" id="confirm-modal-body"></div>
        <div class="modal-actions">
          <button id="confirm-cancel" class="cleanup-btn">Cancel</button>
          <button id="confirm-delete" class="cleanup-btn danger">Delete</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
