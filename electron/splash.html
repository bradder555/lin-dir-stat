<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eef0f4;
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .title {
        font-size: 20px;
        font-weight: 700;
        color: #1c1f24;
        letter-spacing: -0.01em;
      }

      .spinner {
        width: 32px;
        height: 32px;
        border: 4px solid #d6d9df;
        border-top-color: #3b6fe0;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="title">LinDirStat</div>
      <div class="spinner"></div>
    </div>
  </body>
</html>
