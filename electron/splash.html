<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eef0f4;
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .logo {
        display: block;
      }

      .title {
        font-size: 20px;
        font-weight: 700;
        color: #1c1f24;
        letter-spacing: -0.01em;
      }

      .spinner {
        width: 32px;
        height: 32px;
        border: 4px solid #d6d9df;
        border-top-color: #3b6fe0;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <svg class="logo" width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="70" height="70" rx="16" fill="#ffffff" stroke="#dfe3ea" stroke-width="1.5" />
        <rect x="9" y="9" width="30" height="24" rx="4" fill="#3b6fe0" />
        <rect x="41" y="9" width="22" height="54" rx="4" fill="#a9c4f5" />
        <rect x="9" y="37" width="17" height="26" rx="4" fill="#dbe6fb" />
        <rect x="28" y="47" width="11" height="16" rx="3" fill="#5b8def" />
      </svg>
      <div class="title">LinDirStat</div>
      <div class="spinner"></div>
    </div>
  </body>
</html>
