name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.new_release_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --prefix server
      - run: npm install --prefix client
      - run: npm install --prefix electron
      - run: npm run build --prefix client

      - name: Stamp release version into the AppImage filename
        run: npm version ${{ needs.release.outputs.new_release_version }} --no-git-tag-version --allow-same-version
        working-directory: electron

      - run: npm run dist -- --linux AppImage --${{ matrix.arch }}
        working-directory: electron

      - name: Upload AppImage to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release.outputs.new_release_tag }} electron/dist/*.AppImage --clobber
